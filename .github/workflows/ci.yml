name: CI

on:
  push:
  pull_request:

jobs:
  package-and-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source files
        run: |
          python -m compileall -q scripts
          python -m json.tool evals/evals.json > /dev/null
      - name: Install wheel-style package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate installed resources outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          osu-skin selfcheck --json
          python - <<'PY'
          from importlib.resources import files

          database = files("osu_skin_skills.assets").joinpath("osu_skin.db")
          reference = files("osu_skin_skills.references").joinpath("database.md")
          assert database.is_file(), database
          assert reference.is_file(), reference
          PY
