[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-skin-skill-cli"
version = "0.1.0"
description = "CLI entrypoints bundled with the osu! skin skill"
requires-python = ">=3.10"

[project.scripts]
osu-skin = "scripts.__main__:main"

[tool.setuptools]
packages = ["scripts"]
