[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-skin-skills"
version = "0.1.0"
description = "CLI entrypoints bundled with the osu! skin skill"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["Pillow>=10", "mutagen>=1.47"]

[project.scripts]
osu-skin = "osu_skin_skills.__main__:main"

[tool.setuptools]
packages = ["osu_skin_skills", "osu_skin_skills.assets", "osu_skin_skills.references"]
package-dir = { "osu_skin_skills" = "scripts", "osu_skin_skills.assets" = "assets", "osu_skin_skills.references" = "references" }

[tool.setuptools.package-data]
"osu_skin_skills.assets" = ["*.db"]
"osu_skin_skills.references" = ["*.md"]
